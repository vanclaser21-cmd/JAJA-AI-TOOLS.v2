Output JSON structure:

Use Bahasa Indonesia for all text.
Create exactly 4 hooks, 4 CTAs, 6 hashtags, one product analysis, and one content strategy.

Strict response-contract rules (mandatory):
- All hook, cta, and hashtag array items must be non-empty strings. Do not use objects or numbers in these arrays.

Storyboard calculation rules:

    function normalizeResultData(resultData) {
        if (!resultData || typeof resultData !== 'object') return resultData;

        const cleanJsonText = (text) => {
            if (typeof text !== 'string') return text;
            return text
                .replace(/```(?:json)?\s*/gi, '')
                .replace(/\s*```$/g, '')
                .trim();
        };

        const tryParseJson = (text) => {
            if (typeof text !== 'string') return null;
            const cleaned = cleanJsonText(text);
            try {
                return JSON.parse(cleaned);
            } catch {
                // try extracting JSON object substring
                const objStart = cleaned.indexOf('{');
                const objEnd = cleaned.lastIndexOf('}');
                if (objStart !== -1 && objEnd !== -1 && objEnd > objStart) {
                    const candidate = cleaned.slice(objStart, objEnd + 1);
                    try {
                        return JSON.parse(candidate);
                    } catch {}
                }
                const arrStart = cleaned.indexOf('[');
                const arrEnd = cleaned.lastIndexOf(']');
                if (arrStart !== -1 && arrEnd !== -1 && arrEnd > arrStart) {
                    const candidate = cleaned.slice(arrStart, arrEnd + 1);
                    try {
                        return JSON.parse(candidate);
                    } catch {}
                }
            }
            return null;
        };

        const parseJsonStringRecursive = (value) => {
            if (typeof value !== 'string') return value;
            let parsed = tryParseJson(value);
            if (parsed === null) return value;
            while (typeof parsed === 'string') {
                const next = tryParseJson(parsed);
                if (next === null || next === parsed) break;
                parsed = next;
            }
            return parsed;
        };

        const normalized = { ...resultData };

        for (const key of Object.keys(normalized)) {
            normalized[key] = parseJsonStringRecursive(normalized[key]);
        }

        if (typeof normalized.raw === 'string') {
            const rawParsed = parseJsonStringRecursive(normalized.raw);
            if (rawParsed && typeof rawParsed === 'object' && !Array.isArray(rawParsed)) {
                Object.assign(normalized, rawParsed);
                delete normalized.raw;
            } else {
                normalized.raw = rawParsed;
            }
        }

        if (typeof normalized.content === 'string') {
            const contentParsed = parseJsonStringRecursive(normalized.content);
            if (contentParsed && typeof contentParsed === 'object' && !Array.isArray(contentParsed)) {
                Object.assign(normalized, contentParsed);
                delete normalized.content;
            } else {
                normalized.content = contentParsed;
            }
        }

        return normalized;
    }

    function getTemplateFile(category) {

    function getNumber(value, fallback) {
        const number = Number(String(value || '').match(/\d+/)?.[0]);
        return Number.isFinite(number) && number > 0 ? number : fallback;
    }

    function makeSlug(value) {
        return String(value || 'produk')
            .toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9]+/g, '')
            .slice(0, 24) || 'produk';
    }

    function getProductDetails(description) {
        const text = String(description || '').trim();
        const colorMatch = text.match(/\b(hitam|putih|merah|biru|hijau|kuning|ungu|pink|cokelat|cream|krem|abu-abu|silver|gold|emas)\b/i);
        const materialMatch = text.match(/\b(katun|linen|denim|kulit|kulit sintetis|polyester|sutra|wool|kayu|kaca|plastik|metal|aluminium|stainless|silikon)\b/i);

        return {
            product_color: colorMatch ? colorMatch[0] : 'sesuai varian pilihan',
            product_material: materialMatch ? materialMatch[0] : 'material pilihan',
            product_detail: text || 'detail yang praktis untuk kebutuhan harian'
        };
    }

    function replacePlaceholders(value, variables) {
        if (typeof value === 'string') {
            return value.replace(/{{\s*([a-z_]+)\s*}}/gi, (_, key) => variables[key] ?? '');
        }
        if (Array.isArray(value)) return value.map(item => replacePlaceholders(item, variables));
        if (value && typeof value === 'object') {
            return Object.fromEntries(Object.entries(value).map(([key, item]) => [key, replacePlaceholders(item, variables)]));
        }
        return value;
    }

    function pickRandom(items, fallback = null) {
        return Array.isArray(items) && items.length
            ? items[Math.floor(Math.random() * items.length)]
            : fallback;
    }

    function parseCustomDialogScenes(dialog) {
        const text = String(dialog || '').trim();
        if (!text) return [];

        // Preferred input: one quoted block represents exactly one storyboard scene.
        const quotedBlocks = [...text.matchAll(/["“”]([^"“”]+)["“”]/g)]
            .map(match => match[1].trim())
            .filter(Boolean);
        if (quotedBlocks.length) return quotedBlocks;

        // Friendly fallback for a line-per-scene input.
        return text.split(/\r?\n+/).map(line => line.trim()).filter(Boolean);
    }

    function getDialogue(data, sceneIndex, totalScenes, personality) {
        if (data.dialogType === 'No Dialog') return '';
        if (data.dialogType === 'Custom Dialog') {
            // Never repeat the full script: each parsed block belongs to its matching scene.
            return parseCustomDialogScenes(data.customDialog)[sceneIndex] || '';
        }

        const lines = personality?.dialogues || [
            `Guys, aku baru coba ${data.productName} dan detailnya bikin penasaran.`,
            `Jujur, bagian ini yang paling aku notice dari ${data.productName}.`,
            `Aku pakai sebentar dulu biar nggak asal bilang bagus.`,
            `Kalau kamu lagi cari yang begini, coba lihat ${data.productName}.`
        ];
        return lines[sceneIndex % lines.length];
    }

    async function loadUgcTemplate(category) {
        const response = await fetch(`${UGC_TEMPLATE_PATH}${getTemplateFile(category)}.json`, { cache: 'no-store' });
        if (!response.ok) throw new Error('Template UGC tidak dapat dimuat. Jalankan aplikasi melalui server lokal.');
        return response.json();
    }

    async function buildTemplateUgcResult(data) {
        const templateFile = getTemplateFile(data.category);
        const templateData = await loadUgcTemplate(data.category);
        const template = templateData.templates.default;
        const variationPool = templateData.variations?.styles?.[data.contentStyle] || [];
        const selectedVariation = pickRandom(variationPool, { storyboardPattern: [], visualDirection: '' });
        const selectedPersonality = pickRandom(templateData.personalities, null);
        const durationSeconds = getNumber(data.videoDuration, 20);
        const shotSeconds = getNumber(data.shotDuration, 4);
        const shotsPerScene = getNumber(data.sceneStructure, 1);
        const totalShots = Math.ceil(durationSeconds / shotSeconds);
        const calculatedScenes = Math.ceil(totalShots / shotsPerScene);
        // In Custom Dialog mode, each quoted block / line is intentionally one scene.
        // This prevents a full script being assigned to one scene or silently discarded.
        const customDialogScenes = data.dialogType === 'Custom Dialog'
            ? parseCustomDialogScenes(data.customDialog)
            : [];
        const totalScenes = Math.max(calculatedScenes, customDialogScenes.length);
        const productDetails = getProductDetails(data.productDescription);
        const baseVariables = {
            product_name: data.productName.trim(),
            product_color: productDetails.product_color,
            product_material: productDetails.product_material,
            product_detail: productDetails.product_detail,
            target_audience: data.targetMarket,
            platform: data.platform,
            product_slug: makeSlug(data.productName),
            category_template: templateFile,
            scene_duration: `${shotSeconds * shotsPerScene} detik`
        };

        const storyboard = Array.from({ length: totalScenes }, (_, index) => {
            const source = template.storyboard[index % template.storyboard.length];
            const remainingShots = Math.max(1, totalShots - (index * shotsPerScene));
            const sceneShots = Math.min(shotsPerScene, remainingShots);
            // The final grouped scene can be shorter so the total stays aligned to the requested duration.
            const remainingSeconds = Math.max(shotSeconds, durationSeconds - (index * shotsPerScene * shotSeconds));
            const sceneDuration = Math.min(sceneShots * shotSeconds, Math.max(remainingSeconds, 1));
            const dialogue = getDialogue(data, index, totalScenes, selectedPersonality);
            const sceneVariables = {
                ...baseVariables,
                scene_duration: `${sceneDuration} detik`,
                dialogue
            };
            const scene = replacePlaceholders(source, sceneVariables);
            scene.scene = index + 1;
            const pattern = selectedVariation.storyboardPattern?.[index % (selectedVariation.storyboardPattern?.length || 1)];
            if (pattern) scene.visualHook = `${pattern}: ${scene.visualHook}`;
            if (selectedVariation.visualDirection) scene.cameraMovement = `${scene.cameraMovement}; ${selectedVariation.visualDirection}`;
            if (sceneShots > 1) {
                scene.shotType = `${sceneShots} shot: ${scene.shotType}`;
                scene.cameraMovement = `${sceneShots} shot: ${scene.cameraMovement}`;
            }
            return scene;
        });

        const styleDirection = contentStyleDirections[data.contentStyle] || contentStyleDirections.Review;
        return {
            hook: replacePlaceholders(template.hooks, baseVariables),
            cta: replacePlaceholders(template.ctas, baseVariables),
            hashtag: replacePlaceholders(template.hashtags, baseVariables),
            productAnalysis: replacePlaceholders(template.productAnalysis, baseVariables),
            contentStrategy: `${replacePlaceholders(template.contentStrategy, baseVariables)} ${styleDirection} Variasi: ${selectedPersonality?.name || 'creator natural'}; ${selectedVariation.visualDirection || 'visual realistis'}.`,
            storyboard
        };
    }

    async function generateUGC() {
        if (!validateForm()) {
            return;
        }

        const data = collectFormData();
        generateBtn.textContent = 'GENERATING...';
        generateBtn.disabled = true;

        try {
            const result = await buildTemplateUgcResult(data);
            localStorage.setItem(resultStorageKey, JSON.stringify(result));
            // Preserve the raw form selections (including Custom fields) for the next visit.
            saveInputData();
            window.location.href = '/HOME/ugc-result.html';
        } catch (err) {
            console.error(err);
            alert(`Gagal generate: ${err.message || 'Coba lagi atau periksa koneksi server.'}`);
            generateBtn.disabled = false;
            generateBtn.textContent = 'GENERATE';
        }
    }

    if (generateBtn) {
        generateBtn.addEventListener('click', function (event) {
            event.preventDefault();
            generateUGC();
        });
    }
</script>
