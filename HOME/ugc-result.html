<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JAJA AI TOOLS - UGC Result</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/home.css"><link rel="stylesheet" href="../css/workflow.css"><link rel="stylesheet" href="../css/prompt-library.css"></head>
<body><div class="container"><header class="hero"><img src="../assets/header.png" class="hero-banner"></header><div class="dashboard-grid"><a href="../index.html" class="dash-card"><div class="dash-title">HOME</div></a><a href="character-generator.html" class="dash-card"><div class="dash-title">CHARACTER GENERATOR</div></a><a href="#" class="dash-card"><div class="dash-title">MOTION CONTROL</div></a><a href="prompt-library.html" class="dash-card"><div class="dash-title">PROMPT SIAP PAKAI</div></a><a href="#" class="dash-card"><div class="dash-title">CHARACTER CLONE</div></a><a href="#" class="dash-card"><div class="dash-title">IMAGE GENERATOR</div></a><a href="ugc-data.html" class="dash-card"><div class="dash-title">UGC KONTEN</div></a><a href="#" class="dash-card"><div class="dash-title">JAJA BUNDLE</div></a></div><div class="workflow-info"><b>STEP 2</b> <b>UGC RESULT</b><br><br>Review, copy, atau regenerate tiap bagian tanpa membuat ulang storyboard lengkap.</div><div class="project-form"><label>HOOK</label><textarea id="hookTextarea" readonly style="height:100px;"></textarea><div class="workflow-nav"><button class="next-btn" type="button" data-copy="hookTextarea">COPY</button><button class="next-btn" type="button" id="regenerateHook">REGENERATE HOOK</button></div><label>CTA</label><textarea id="ctaTextarea" readonly style="height:100px;"></textarea><div class="workflow-nav"><button class="next-btn" type="button" data-copy="ctaTextarea">COPY</button><button class="next-btn" type="button" id="regenerateCta">REGENERATE CTA</button></div><label>HASHTAG</label><textarea id="hashtagTextarea" readonly style="height:100px;"></textarea><div class="workflow-nav"><button class="next-btn" type="button" data-copy="hashtagTextarea">COPY</button><button class="next-btn" type="button" id="regenerateHashtag">REGENERATE HASHTAG</button></div><label>PRODUCT ANALYSIS</label><textarea id="productAnalysisTextarea" readonly style="height:120px;"></textarea><label>CONTENT STRATEGY</label><textarea id="contentStrategyTextarea" readonly style="height:120px;"></textarea><label for="sceneSelect">MASTER STORYBOARD — PILIH SCENE</label><select id="sceneSelect"></select><textarea id="storyboardTextarea" readonly style="height:260px;"></textarea><div class="workflow-nav"><button class="next-btn" type="button" data-copy="storyboardTextarea">COPY</button><button class="next-btn" type="button" id="regenerateScene">REGENERATE SCENE</button></div><div style="display:flex;justify-content:center;align-items:center;width:100%;margin-top:22px;"><a href="ugc-production.html" class="next-btn" style="display:inline-flex;width:auto;text-decoration:none;padding:14px 22px;">lanjut dsini bosku..</a></div></div></div>
<script>
const resultStorageKey='jaja_ugc_result',inputStorageKey='jaja_ugc_input';let result={},input={};const $=id=>document.getElementById(id),random=a=>a[Math.floor(Math.random()*a.length)];function save(){localStorage.setItem(resultStorageKey,JSON.stringify(result))}function read(key){try{return JSON.parse(localStorage.getItem(key)||'{}')}catch{return {}}}function asArray(v){return Array.isArray(v)?v:(typeof v==='string'?v.split(/\n|,|;/).map(x=>x.trim()).filter(Boolean):[])}function sceneText(s){if(!s)return '';return `SCENE ${s.scene}\n\nDurasi: ${s.duration||''}\nTipe shot: ${s.shotType||''}\nKamera: ${s.cameraMovement||''}\nLensa: ${s.lens||''}\nFokus: ${s.focus||''}\nPosisi: ${s.position||''}\nVisual hook: ${s.visualHook||''}\nEkspresi: ${s.expression||''}\nGerak tubuh: ${s.bodyLanguage||''}\nDialog: ${s.dialogue||'-'}\nProduk/Layanan: ${s.productDescription||''}\nPencahayaan: ${s.lighting||''}\nLokasi: ${s.location||''}`}function allScenesText(){return result.storyboard.map(sceneText).join('\n\n====================\n\n')}function renderScene(){const value=$('sceneSelect').value;$('storyboardTextarea').value=value==='all'?allScenesText():sceneText(result.storyboard?.[Number(value)||0])}function render(){result.hook=asArray(result.hook);result.cta=asArray(result.cta);result.hashtag=asArray(result.hashtag);result.storyboard=Array.isArray(result.storyboard)?result.storyboard:[];$('hookTextarea').value=result.hook.join('\n');$('ctaTextarea').value=result.cta.join('\n');$('hashtagTextarea').value=result.hashtag.join(' ');$('productAnalysisTextarea').value=result.productAnalysis||'';$('contentStrategyTextarea').value=result.contentStrategy||'';const selector=$('sceneSelect'),selected=selector.value;selector.innerHTML='<option value="all">All Scene</option>'+result.storyboard.map((s,i)=>`<option value="${i}">Scene ${s.scene||i+1}</option>`).join('');selector.value=(selected==='all'||(selected!==''&&result.storyboard[selected]))?selected:'all';renderScene()}function product(){return input.productName||'produk ini'}function regenerate(kind){const p=product(),options={hook:[`Guys, aku baru notice detail ${p} ini.`,`Jujur, ${p} ternyata nggak seperti yang aku kira.`,`Stop scroll kalau kamu lagi cari ${p}.`,`Aku coba ${p} biar tahu hype-nya masuk akal atau nggak.`],cta:[`Kalau penasaran, cek ${p} dulu ya.`,`Simpan dulu, siapa tahu kamu lagi butuh ${p}.`,`Lihat detail ${p} sebelum pilih yang lain.`,`Kalau relate sama kebutuhannya, coba cek ${p}.`],hashtag:[`#${String(p).toLowerCase().replace(/[^a-z0-9]+/g,'')} #ugcindonesia #reviewjujur #fyp #rekomendasi #creatorindonesia`,`#tiktokmademebuyit #ugccontent #${String(p).toLowerCase().replace(/[^a-z0-9]+/g,'')} #reviewproduk #viral #fyp`]};if(kind==='hashtag')result.hashtag=random(options.hashtag).split(' ');else result[kind]=[random(options[kind]),random(options[kind]),random(options[kind]),random(options[kind])];save();render()}function regenerateCurrentScene(){const selected=$('sceneSelect').value;if(selected==='all'){alert('Pilih satu scene dulu untuk regenerate scene.');return}const i=Number(selected)||0,s=result.storyboard?.[i];if(!s)return;const variants=[['handheld candid, slight motion blur','creator reacts naturally while showing detail'],['slow push-in with realistic focus pull','small hand movement and authentic micro expression'],['phone-camera angle with natural sway','object interaction follows real weight and momentum'],['close-up orbit with subtle secondary motion','natural body shift, not a posed commercial move'],['over-shoulder reveal with grounded camera motion','casual reaction and tactile product interaction']],v=random(variants);s.cameraMovement=v[0];s.visualHook=v[1];s.expression=random(['penasaran dan natural','jujur, sedikit terkejut','santai dan percaya diri','fokus melihat detail']);s.bodyLanguage='Gerakan kecil natural, berat tubuh dan tangan terasa realistis';save();renderScene()}async function copy(id){try{await navigator.clipboard.writeText($(id).value);alert('Berhasil disalin.')}catch{$(id).select();document.execCommand('copy');alert('Berhasil disalin.')}}document.addEventListener('DOMContentLoaded',()=>{result=read(resultStorageKey);input=read(inputStorageKey);if(!result.storyboard?.length){$('storyboardTextarea').value='Belum ada hasil UGC. Kembali ke UGC Data untuk generate.';return}render();$('sceneSelect').addEventListener('change',renderScene);$('regenerateHook').onclick=()=>regenerate('hook');$('regenerateCta').onclick=()=>regenerate('cta');$('regenerateHashtag').onclick=()=>regenerate('hashtag');$('regenerateScene').onclick=regenerateCurrentScene;document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b.dataset.copy))});
</script></body></html>
