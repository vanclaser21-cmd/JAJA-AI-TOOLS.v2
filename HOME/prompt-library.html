<section class="prompt-library">


<div class="prompt-panel">


<div class="card">


<h2>
🌐 Bahasa Prompt
</h2>


<select id="language">

<option value="indonesia">
🇮🇩 Indonesia
</option>


<option value="english">
🇺🇸 English
</option>


</select>


</div>




<div class="card">


<h2>
⚡ Pilih Prompt
</h2>


<select id="category">


<option value="motionDetail">
🎬 Motion Control Detail
</option>


<option value="motionSimple">
🎥 Motion Control Sederhana
</option>


<option value="faceSwap">
🎭 Ganti Wajah Avatar
</option>


<option value="faceLighting">
💡 Natural Face Lighting
</option>


<option value="replaceBackground">
🌍 Ganti Tempat / Background
</option>


<option value="backgroundLighting">
🏠 Lighting Ruangan
</option>


<option value="avatarCloseUp">
🧍 Avatar Close Up
</option>


<option value="avatarFullBody">
🚶 Avatar Full Body
</option>


<option value="cosplay">
👘 Cosplay
</option>


<option value="outfitPoseBackground">
✨ Outfit + Pose + Background
</option>


<option value="extendMotion">
🔗 Sambung Video Motion
</option>


<option value="sceneLock">
🔒 Scene Prompt Lock
</option>


<option value="flowLock">
🛡 Flow Command Lock
</option>


<option value="identityLock">
🔒 Identity Lock Prompt
</option>


</select>


</div>


</div>

<div class="prompt-result card">


<h2 id="promptTitle">

🎬 Motion Control Detail

</h2>



<textarea id="promptText" readonly>

</textarea>



<div class="button-group">


<button id="copyPrompt">

📋 COPY PROMPT

</button>


</div>
